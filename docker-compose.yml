services:
  flcapp:
    image: flcapp
    build:
      context: ./FlashlightCinema/FlashlightCinema.Api      # folder containing the .csproj
      dockerfile: Dockerfile                                # relative to context
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: "1"                                         # limit resource to one
    ports:
      - "5001-5003:8080"                                    # nginx will use docker host ip instead of port, so it won't be used in nginx

  nginx:
    image: nginx:alpine
    ports:
      - "5000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - flcapp